<style>
  /* « Demain, monde ouvert » : un atoll de porcelaine en cadran sur une mer d'émail qui s'étend jusqu'à l'horizon ; une tour translucide
     où chaque agent est une nuée de lettres à l'étage de son état réel ; les productions mortes en ruines dans le lagon, par mois ; la grotte au fond.
     Le décor est imaginaire, ce qui s'y passe est vrai. Jour et nuit suivent l'heure du studio. */
  :root {
    --display: 'Bricolage Grotesque', 'Avenir Next', 'Segoe UI', sans-serif;
    --texte: 'Instrument Sans', 'Helvetica Neue', Arial, sans-serif;
    --mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace;
    --zc: 460px; /* hauteur minimale d'eau claire en haut du lagon, quel que soit le nombre de strates */
  }
  body.jour {
    --fond: #e8ecf0; --t1: #16223d; --t2: #525e75; --carte: rgba(255,255,255,.94); --carte-plein: #ffffff; --carte-bd: rgba(22,34,61,.1); --carte-l: #3a4660;
    --vert: #16705a; --alerte: #b02a43; --ambre: #8a5a00; --accent: #2f4bff; --pill-bd: rgba(22,34,61,.22);
    --ombre: 0 6px 18px rgba(22,34,61,.1); --jauge-fond: rgba(22,34,61,.08); --barre-bg: rgba(232,236,240,.88); --sourd: #dce2e8;
    --bouton-bg: #16223d; --bouton-txt: #ffffff; --bouton-hover: #24345a;
    --b-vivante: #e6ebff; --b-vivante-t: #2a43e0; --b-alerte: #fbe7ea; --b-chantier: #f7eedb; --j-vie: #2f4bff;
    color-scheme: light;
  }
  body.nuit {
    --fond: #0d1730; --t1: #f3f5f8; --t2: #b8c4dc; --carte: rgba(19,29,58,.92); --carte-plein: #131d3a; --carte-bd: rgba(232,236,240,.14); --carte-l: #c9d3e6;
    --vert: #74e2b6; --alerte: #ff9cab; --ambre: #f7c96a; --accent: #b4c0ff; --pill-bd: rgba(232,236,240,.3);
    --ombre: 0 6px 18px rgba(0,6,20,.4); --jauge-fond: rgba(232,236,240,.14); --barre-bg: rgba(13,23,48,.88); --sourd: #24304f;
    --bouton-bg: #f3f5f8; --bouton-txt: #0d1730; --bouton-hover: #d9e0ec;
    --b-vivante: rgba(180,192,255,.16); --b-vivante-t: #c9d1ff; --b-alerte: rgba(255,156,171,.14); --b-chantier: rgba(247,201,106,.14); --j-vie: #b4c0ff;
    color-scheme: dark;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; scroll-padding-top: 64px; }
  body { background: var(--fond); color: var(--t1); font-family: var(--texte); font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
  a { color: var(--accent); }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .sr:focus { position: fixed; z-index: 50; top: 8px; left: 8px; width: auto; height: auto; clip: auto; padding: 8px 12px; background: var(--carte-plein); border-radius: 8px; }
  .ancre { display: block; height: 0; }

  /* ---------- barre du haut ---------- */
  .barre { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 12px; padding: 10px max(16px, env(safe-area-inset-left)); padding-top: max(10px, env(safe-area-inset-top));
    background: var(--barre-bg); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid var(--carte-bd); }
  .barre .logo { font-family: var(--display); font-weight: 800; font-size: 19px; letter-spacing: -.04em; text-decoration: none; color: var(--t1); white-space: nowrap; }
  .barre nav { flex: 1; min-width: 0; overflow-x: auto; scrollbar-width: none; -webkit-mask-image: linear-gradient(90deg, #000 88%, transparent); mask-image: linear-gradient(90deg, #000 88%, transparent); }
  .barre nav::-webkit-scrollbar { display: none; }
  .barre nav ul { display: flex; gap: 4px; list-style: none; padding-right: 24px; }
  .barre nav a { display: block; padding: 6px 10px; border-radius: 999px; font-size: 14px; color: var(--t1); text-decoration: none; white-space: nowrap; }
  .barre nav a:hover { background: var(--carte); }
  .outils { display: flex; gap: 6px; align-items: center; }
  .langue { display: inline-flex; border: 1px solid var(--carte-bd); border-radius: 999px; background: var(--carte); padding: 2px; }
  .langue button { border: 0; background: none; padding: 5px 10px; border-radius: 999px; font-family: var(--mono); font-size: 12px; cursor: pointer; min-width: 40px; min-height: 32px; }
  .langue button[aria-pressed="true"] { background: var(--t1); color: var(--fond); }
  .rss { display: inline-flex; align-items: center; justify-content: center; width: 36px; height: 36px; border-radius: 50%; background: var(--carte); border: 1px solid var(--carte-bd); }
  .rss svg { width: 16px; height: 16px; fill: var(--ambre); }

  /* ---------- surface : l'atoll-cadran ---------- */
  #surface { position: relative; }
  .scene { position: relative; height: 840px; overflow: hidden; touch-action: manipulation; }
  .scene canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .haut { position: absolute; z-index: 3; top: 20px; left: 28px; max-width: 520px; pointer-events: none; }
  .haut h1 { font-family: var(--display); font-weight: 800; font-size: 44px; letter-spacing: -.045em; line-height: .95; color: var(--t1); }
  .haut .sous { font-family: var(--display); font-weight: 300; font-size: 18px; color: var(--t2); margin-top: 4px; letter-spacing: -.01em; }
  .pastilles { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .pastille { display: inline-flex; align-items: center; gap: 6px; font: 500 10.5px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--t1); border: 1px solid var(--pill-bd); border-radius: 999px; padding: 6px 10px; background: var(--carte); }
  .pastille b { font-weight: 500; color: var(--accent); }
  .horloge { position: absolute; top: 20px; right: 28px; z-index: 3; text-align: right; }
  .horloge .sur { font: 500 11px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--t2); }
  .horloge .h { font: 600 46px/1 var(--display); letter-spacing: -.02em; color: var(--t1); font-variant-numeric: tabular-nums; margin-top: 6px; }
  .horloge time { display: block; font: 400 12.5px/1.4 var(--mono); color: var(--t2); margin-top: 4px; }
  .horloge .cle { font: 400 11.5px/1.5 var(--texte); color: var(--t2); margin-top: 4px; }
  .horloge .cle i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; vertical-align: -1px; margin: 0 4px 0 8px; }
  .horloge .cle i.trait { width: 14px; height: 3px; border-radius: 2px; vertical-align: middle; }
  .maree { position: absolute; top: 150px; left: 28px; z-index: 4; max-width: 420px; background: var(--carte); border: 1px solid var(--carte-bd); border-left: 3px solid #5aa2b1; border-radius: 0 10px 10px 0; padding: 9px 13px; box-shadow: var(--ombre); font: 400 12.5px/1.45 var(--texte); color: var(--carte-l); }
  .maree b { display: block; font: 600 11px/1.3 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--t1); }
  .cartes-s, .etages { position: absolute; inset: 0; pointer-events: none; list-style: none; z-index: 2; }
  .fiche-ile { position: absolute; pointer-events: auto; background: var(--carte); border: 1px solid var(--carte-bd); border-radius: 10px; padding: 10px 12px 11px; box-shadow: var(--ombre); }
  .fiche-ile h3 { font: 600 15px/1.2 var(--display); color: var(--t1); }
  .fiche-ile .etat { display: flex; align-items: center; gap: 6px; margin-top: 4px; font: 500 11px/1.35 var(--mono); letter-spacing: .04em; text-transform: uppercase; color: var(--c); }
  .fiche-ile .etat i { flex: none; width: 7px; height: 7px; border-radius: 50%; background: var(--c); }
  .fiche-ile .l { font: 400 12px/1.45 var(--mono); color: var(--carte-l); margin-top: 3px; }
  .fiche-ile .jouer { display: inline-block; margin-top: 6px; font: 500 12px/1 var(--mono); color: var(--accent); text-underline-offset: 3px; padding: 4px 0; }
  .jauge-s { height: 5px; border-radius: 3px; background: var(--jauge-fond); margin-top: 8px; overflow: hidden; }
  .jauge-s span { display: block; height: 100%; background: var(--c); border-radius: 3px; }
  .etages li { position: absolute; pointer-events: auto; background: var(--carte); border-left: 3px solid var(--c); border-radius: 0 8px 8px 0; padding: 6px 11px 7px; font: 400 12.5px/1.4 var(--texte); color: var(--carte-l); max-width: 330px; box-shadow: var(--ombre); }
  .etages li b { display: block; font: 500 10.5px/1.3 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--t1); }
  .lien-agent { border: 0; background: none; padding: 0; font: 600 12.5px/1.4 var(--texte); color: var(--accent); text-decoration: underline; text-underline-offset: 2px; cursor: pointer; min-height: 24px; }
  .polaris { position: absolute; z-index: 2; max-width: 260px; background: var(--carte); border: 1px solid var(--carte-bd); border-left: 3px solid #cfe3ff; border-radius: 0 8px 8px 0; padding: 6px 11px 7px; font: 400 12.5px/1.4 var(--texte); color: var(--carte-l); box-shadow: var(--ombre); }
  .polaris .lien-agent { display: block; font: 500 10.5px/1.3 var(--mono); letter-spacing: .1em; text-transform: uppercase; }
  .legende-s { position: absolute; left: 28px; bottom: 22px; z-index: 2; max-width: 610px; font-size: 13px; line-height: 1.5; color: var(--carte-l); background: var(--carte); border: 1px solid var(--carte-bd); border-radius: 10px; padding: 9px 13px; box-shadow: var(--ombre); }
  .legende-s b { color: var(--t1); font-weight: 600; }
  .plonger { position: absolute; right: 28px; bottom: 24px; z-index: 2; font: 500 12px/1 var(--mono); letter-spacing: .06em; color: var(--accent); text-decoration: none; border: 1px solid var(--pill-bd); border-radius: 999px; padding: 13px 16px; background: var(--carte); box-shadow: var(--ombre); }

  /* ---------- sections de la surface (îles, naissances, journal, équipage) ---------- */
  main section.bloc { max-width: 1180px; margin: 0 auto; padding: 64px 24px 8px; }
  .bloc > header { margin-bottom: 22px; max-width: 70ch; }
  .bloc h2 { font-family: var(--display); font-weight: 800; font-size: clamp(28px, 3.4vw, 40px); letter-spacing: -.035em; line-height: 1; }
  .bloc > header p { color: var(--t2); margin-top: 8px; }
  .surtitre { font-family: var(--mono); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--t2); margin-bottom: 6px; display: block; }
  .grille { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr)); gap: 16px; }
  .carte { background: var(--carte-plein); border: 1px solid var(--carte-bd); border-radius: 16px; padding: 20px; box-shadow: var(--ombre); display: flex; flex-direction: column; gap: 12px; position: relative; }
  .carte h3 { font-family: var(--display); font-weight: 600; font-size: 22px; letter-spacing: -.02em; line-height: 1.1; }
  .badge { display: inline-flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: 12px; padding: 3px 9px; border-radius: 999px; background: var(--sourd); color: var(--t2); width: fit-content; }
  .badge.vivante { background: var(--b-vivante); color: var(--b-vivante-t); }
  .badge.alerte { background: var(--b-alerte); color: var(--alerte); }
  .badge.chantier { background: var(--b-chantier); color: var(--ambre); }
  .jauge { display: grid; gap: 4px; }
  .jauge .l { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; }
  .jauge .l span:last-child { font-family: var(--mono); font-size: 13px; font-variant-numeric: tabular-nums; }
  .jauge .barre-j { height: 8px; border-radius: 4px; background: var(--jauge-fond); overflow: hidden; }
  .jauge .barre-j i { display: block; height: 100%; border-radius: 4px; background: var(--j-vie); }
  .jauge.alerte .barre-j i { background: var(--alerte); }
  .jauge.vues .barre-j i { background: var(--t1); }
  .meta { font-family: var(--mono); font-size: 12.5px; color: var(--t2); }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: auto; padding-top: 4px; }
  .bouton { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 10px 18px; border-radius: 999px; font-weight: 600; font-size: 15px; text-decoration: none;
    background: var(--bouton-bg); color: var(--bouton-txt); border: 1px solid var(--bouton-bg); cursor: pointer; }
  .bouton:hover { background: var(--bouton-hover); }
  .bouton.second { background: transparent; color: var(--t1); border-color: var(--pill-bd); }
  .bouton.second:hover { background: var(--carte); }
  .bouton[aria-disabled="true"], .bouton:disabled { background: var(--sourd); color: var(--t2); border-color: transparent; cursor: not-allowed; }
  .vide-msg { color: var(--t2); font-style: italic; }
  .vers-lagon { display: inline-block; margin-top: 18px; font-family: var(--mono); font-size: 13px; text-underline-offset: 3px; padding: 6px 0; }
  .idees { list-style: none; display: grid; gap: 10px; counter-reset: rang; }
  .idee { display: grid; grid-template-columns: auto 1fr auto; gap: 14px; align-items: start; background: var(--carte-plein); border: 1px solid var(--carte-bd); border-radius: 14px; padding: 16px 18px; counter-increment: rang; }
  .idee::before { content: counter(rang); font-family: var(--display); font-weight: 800; font-size: 26px; line-height: 1; color: var(--ambre); min-width: 1.2em; }
  .idee h3 { font-family: var(--display); font-weight: 600; font-size: 19px; letter-spacing: -.02em; }
  .idee p { color: var(--t2); font-size: 15px; margin-top: 2px; }
  .idee .note { font-family: var(--mono); font-size: 14px; text-align: right; white-space: nowrap; color: var(--t2); }
  .idee .note b { font-size: 20px; font-weight: 500; color: var(--t1); }
  .vote { margin-top: 18px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .vote p { color: var(--t2); font-size: 14px; }
  .journal { list-style: none; border-left: 2px solid var(--pill-bd); margin-left: 6px; }
  .journal li { position: relative; padding: 0 0 18px 22px; }
  .journal li::before { content: ""; position: absolute; left: -6px; top: 7px; width: 10px; height: 10px; border-radius: 50%; background: var(--fond); border: 2px solid var(--t2); }
  .journal .tete { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; font-family: var(--mono); font-size: 12.5px; color: var(--t2); }
  .journal .qui { border: 0; background: none; padding: 0; font-family: var(--mono); font-size: 12.5px; color: var(--accent); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; min-height: 24px; }
  .journal .qui.simple { color: var(--t1); text-decoration: none; cursor: default; }
  .journal p { margin-top: 2px; max-width: 75ch; }
  .plus { margin-top: 6px; }
  .equipe { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 260px), 1fr)); gap: 16px; }
  .equipe h3 { font-family: var(--mono); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--t2); margin-bottom: 8px; font-weight: 500; }
  .equipe ul { list-style: none; display: grid; gap: 6px; }
  .equipe button { width: 100%; text-align: left; display: grid; grid-template-columns: 12px 1fr; gap: 2px 10px; align-items: center; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--carte-bd); background: var(--carte-plein); cursor: pointer; min-height: 44px; }
  .equipe button:hover { border-color: var(--accent); }
  .equipe .pt { width: 10px; height: 10px; border-radius: 50%; }
  .equipe b { font-family: var(--display); font-weight: 600; }
  .equipe small { grid-column: 2; color: var(--t2); font-size: 13px; }

  /* ---------- lagon : clair sous la surface (zone claire minimale --zc), puis il s'assombrit jusqu'au bleu nuit des abysses ---------- */
  #lagon { position: relative; overflow: hidden; padding-bottom: 30px; margin-top: 72px;
    background: linear-gradient(#d3efec 0, #b6e2df 140px, #8fc8cb 300px, #63a3b3 calc(var(--zc) + (100% - var(--zc)) * .1), #3f7892 calc(var(--zc) + (100% - var(--zc)) * .25),
      #26506f calc(var(--zc) + (100% - var(--zc)) * .4), #162e54 calc(var(--zc) + (100% - var(--zc)) * .55), #0c1734 calc(var(--zc) + (100% - var(--zc)) * .7),
      #081027 calc(var(--zc) + (100% - var(--zc)) * .82), #050a1c calc(var(--zc) + (100% - var(--zc)) * .92), #03060f 100%); }
  body.nuit #lagon { background: linear-gradient(#1d4b59 0, #1a4456 160px, #163b52 300px, #0f2747 calc(var(--zc) + (100% - var(--zc)) * .15),
      #0c1734 calc(var(--zc) + (100% - var(--zc)) * .35), #081027 calc(var(--zc) + (100% - var(--zc)) * .6), #050a1c calc(var(--zc) + (100% - var(--zc)) * .85), #03060f 100%); }
  body.jour .sombre { --t1: #f3f5f8; --t2: #b8c4dc; --carte: rgba(12,20,42,.88); --carte-bd: rgba(232,236,240,.14); --carte-l: #c9d3e6;
    --accent: #b4c0ff; --pill-bd: rgba(232,236,240,.3); --ombre: 0 6px 18px rgba(0,6,20,.4); }
  #lagon::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 760px; pointer-events: none; z-index: 0;
    background: repeating-linear-gradient(100deg, rgba(255,255,255,0) 0 110px, rgba(255,255,255,.16) 110px 150px, rgba(255,255,255,0) 150px 300px);
    -webkit-mask-image: linear-gradient(#000, transparent); mask-image: linear-gradient(#000, transparent); }
  body.nuit #lagon::before { background: repeating-linear-gradient(100deg, rgba(255,214,140,0) 0 110px, rgba(255,214,140,.05) 110px 150px, rgba(255,214,140,0) 150px 300px); }
  .deco { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  .deco span { position: absolute; font: 400 var(--s, 10px)/1 var(--mono); color: #ffffff; animation: coule var(--t) linear infinite; animation-delay: var(--dl); opacity: 0; }
  body.nuit .deco span { color: #8ff5ea; text-shadow: 0 0 6px rgba(120,240,230,.6); }
  .pause .deco span { animation-play-state: paused; }
  @keyframes coule { 0% { transform: translate(0, 0); opacity: 0; } 15% { opacity: var(--a); } 85% { opacity: var(--a); } 100% { transform: translate(var(--dx), 150px); opacity: 0; } }
  .flottaison { position: relative; z-index: 1; padding: 70px 28px 34px; text-align: center; }
  .flottaison svg { position: absolute; left: 0; top: 0; width: 100%; height: 30px; }
  .flottaison .plaque { display: inline-block; max-width: 760px; background: var(--carte); border: 1px solid var(--carte-bd); border-radius: 14px; padding: 18px 24px 20px; box-shadow: var(--ombre); }
  .flottaison .sur { font: 500 11px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--t2); }

  else { ctx.strokeStyle = "rgba(47,75,255,.42)"; ctx.lineWidth = 5 * s + 1; ctx.beginPath(); ctx.moveTo(...c); ctx.lineTo(...tipM); ctx.stroke(); ctx.strokeStyle = "rgba(255,255,255,.98)"; }
  ctx.lineWidth = 1.8 * s + .6; ctx.beginPath(); ctx.moveTo(...c); ctx.lineTo(...tipM); ctx.stroke();

  const th = h * 30, pied = P(G, th, G.R), a = P(G, th - 4, G.R * .97), b = P(G, th + 4, G.R * .97);
  const g = ctx.createLinearGradient(c[0], c[1], pied[0], pied[1]);
  if (NUIT) { g.addColorStop(0, "rgba(233,238,245,.12)"); g.addColorStop(1, "rgba(233,238,245,.5)"); } else { g.addColorStop(0, "rgba(246,196,69,.12)"); g.addColorStop(1, "rgba(246,196,69,.6)"); }
  ctx.fillStyle = g; poly(ctx, [c, a, b]); ctx.fill();
  ctx.strokeStyle = NUIT ? "rgba(233,238,245,.8)" : "rgba(201,138,18,.85)"; ctx.lineWidth = 1.6 * s + .5; ctx.beginPath(); ctx.moveTo(...c); ctx.lineTo(...pied); ctx.stroke();
  const ax = pied[0], ay = pied[1] - 56 * s - 8, ar = 14 * s + 5;
  ombre(ctx, pied[0] + 10 * s, pied[1] + 3 * s, ar * 1.2, ar * .45, NUIT ? .35 : .2);
  ctx.strokeStyle = NUIT ? "rgba(233,238,245,.7)" : "rgba(22,34,61,.35)"; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(ax, ay + ar); ctx.lineTo(...pied); ctx.stroke();

  lueur(ctx, ax, ay, ar * 4, NUIT ? "#dce8ff" : "#ffe6a0", NUIT ? .45 : .7, NUIT);
  if (NUIT) sphere(ctx, ax, ay, ar, "#ffffff", "#c9d3e2", "rgba(232,236,240,.6)");
  else sphere(ctx, ax, ay, ar, "#fffbec", "#f2bd3c", "rgba(201,138,18,.8)");
}
/** Repère « aujourd'hui » (date du studio) sur le récif : un petit mât de porcelaine et un fanion ambre. */

function image(now) {
  const ctx = S.ctx, G = S.G, t = CALME ? 3.2 : now / 1000, st = studio();
  S.cibles = [];
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.drawImage(S.fondA, 0, 0); ctx.setTransform(S.dpr, 0, 0, S.dpr, 0, 0);
  dessinerMer(ctx, t);
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.drawImage(S.fondB, 0, 0); ctx.setTransform(S.dpr, 0, 0, S.dpr, 0, 0);
  const c = [G.cx, G.cy - 10 * G.sc], rxS = 160 * G.sc, ryS = rxS * G.k;
  for (const p of S.iles) ponton(ctx, bord(c, rxS, ryS, p.pos), bord([p.pos[0], p.pos[1] - p.hb * .5], p.r, p.r * G.k, c), { pointille: p.etat === "chantier" });
  if (S.naitre) ponton(ctx, bord(c, rxS, ryS, S.naitre.pos), bord(S.naitre.pos, 40 * G.sc, 40 * G.sc * G.k, c), { pointille: true });
  S.noms = [];

/** Place les fiches à gauche (îles), le registre des étages à droite de la tour, l'étiquette de Polaris ; calcule les traits. */
function placerTextes() {
  const G = S.G; S.liens = [];
  const pol = document.getElementById("polaris");
  if (G.tel || PARTAGE) { for (const { el } of S.cartes) { el.style.left = el.style.top = el.style.width = ""; } for (const { li } of S.lis) { li.style.left = li.style.top = li.style.maxWidth = ""; } pol.style.left = pol.style.top = ""; return; }
  const w = 236, x0 = 24, ancre = id => (id === "naitre" ? S.naitre : S.iles.find(q => q.id === id))?.ancre;
  const HAUT0 = document.querySelector(".haut").offsetHeight + 34;
  const items = S.cartes.map(c => { c.el.style.width = w + "px"; return { ...c, a: ancre(c.id), h: c.el.offsetHeight }; }).filter(it => it.a).sort((p, q) => p.a[1] - q.a[1]);
  let yMin = HAUT0; for (const it of items) { it.y = Math.max(yMin, it.a[1] - it.h / 2 - 30); yMin = it.y + it.h + 14; }
  const bas = G.Hs - 130, dep = items.length ? items[items.length - 1].y + items[items.length - 1].h - bas : 0;
  if (dep > 0) { yMin = HAUT0; for (const it of items) { it.y = Math.max(yMin, it.y - dep); yMin = it.y + it.h + 10; } } // jamais deux fiches l'une sur l'autre
  for (const it of items) { it.el.style.left = x0 + "px"; it.el.style.top = it.y + "px"; S.liens.push([it.a[0], it.a[1], x0 + w, it.y + it.h / 2]); }
  // registre des étages : chaque étiquette au plus près de son étage, sans recouvrir un chiffre ni un mois du cadran (trait oblique si elle se décale)
  const T = S.T, ECART = 6, MARGE = 3, HAUT = Math.max(132, document.querySelector(".horloge").getBoundingClientRect().bottom - document.getElementById("surface").getBoundingClientRect().top + 10), BAS = G.Hs - 110;
  let gx = G.cx + T.xd + 50;
  for (const z of S.zones) if (z.l < gx && z.r > gx && z.r - gx < 12) gx = z.r + MARGE;
  const touche = (y, h, w2) => S.zones.some(z => gx < z.r && gx + w2 + MARGE > z.l && y - MARGE < z.b && y + h + MARGE > z.t);
  const regs = S.lis.map(({ li, id }) => { const e = T.et.find(q => q.id === id), mid = (e.y0 + e.y1 + T.dalle) / 2;
    li.style.left = gx + "px"; li.style.maxWidth = Math.min(330, G.W - gx - 16) + "px"; const h = li.offsetHeight; return { li, mid, h, w: li.offsetWidth, cible: mid - h / 2 }; });
  let prec = null;
  regs.forEach((r, i) => {
    const ys = new Set([r.cible, ...S.zones.flatMap(z => [z.t - r.h - MARGE - 1, z.b + MARGE + 1])]);
    if (prec) for (const c of prec) ys.add(c.y + regs[i - 1].h + ECART);
    const cands = [];
    for (const y of ys) { if (y < HAUT || y + r.h > BAS || touche(y, r.h, r.w)) continue;
      let best = null; if (!prec) best = { cout: 0, de: null };
      else for (const c of prec) if (c.y + regs[i - 1].h + ECART <= y + .5 && (!best || c.cout < best.cout)) best = { cout: c.cout, de: c };
      if (best) cands.push({ y, cout: best.cout + Math.abs(y - r.cible), de: best.de }); }
    prec = cands.length ? cands : null;
    if (!prec) prec = [{ y: Math.max(HAUT, r.cible), cout: 0, de: null }];
  });
  let c = prec.reduce((m, q) => (q.cout < m.cout ? q : m));
  for (let i = regs.length - 1; i >= 0; i--) { regs[i].y = c.y; c = c.de || { y: regs[Math.max(0, i - 1)].cible }; }
  for (const r of regs) { r.li.style.top = r.y + "px"; S.liens.push([G.cx + T.xd + 4, r.mid, gx, r.y + r.h / 2]); }
  if (NUIT && S.polaris) { const [px, py] = S.polaris; pol.style.left = Math.min(px + 40, G.W - 276) + "px"; pol.style.top = Math.max(8, py - 26) + "px"; }
}

const moisLong = cle => new Intl.DateTimeFormat(t("locale"), { month: "long", year: "numeric", timeZone: "UTC" }).format(new Date(Date.UTC(Math.floor(cle / 12), cle % 12, 15)));
const cleMois = m => { const [a, b] = String(m).split("-").map(Number); return a * 12 + b - 1; };

function bancHTML(liste, mois) {
  const noms = liste.slice(0, 3).map(e => e.nom).join(", ");
  return `<details class="banc"><summary>${pileSVG()}<span class="banc-titre">${esc(t("banc_titre", liste.length))}<span class="fl" data-ouvert="${esc(t("replier"))}" data-ferme="${esc(t("deplier"))}">${esc(t("deplier"))}</span></span>` +
    `<span class="banc-sous">${esc(t("banc_sous", SEUIL_BANC, mois))}</span><span class="banc-noms">${esc(t("banc_noms", noms, liste.length - 3))}</span></summary>` +

/** Strates fournies par le générateur ; si le mois du studio a avancé depuis la génération, les mois manquants s'ajoutent en haut (tout descend d'autant). */
function strates() {
  const s0 = DONNEES.strates || [], cleAuj = cleMois(studio().iso);
  const haut = s0.length ? cleMois(s0[0].mois) : cleAuj, liste = [];
  for (let k = cleAuj; k > haut; k--) liste.push({ cle: k, ruines: [], banc: false });
  for (const s of s0) liste.push({ cle: cleMois(s.mois), ruines: s.ruines, banc: s.banc });
  return liste.map((s, age) => ({ ...s, age, profondeur: (age + 1) * METRES_PAR_MOIS }));
}
function construireLagon() {
  const parId = Object.fromEntries(DONNEES.jardin.map(j => [j.id, j])), premiere = DONNEES.premiere_mise_a_l_eau;
  document.getElementById("strates").innerHTML = strates().map(s => {
    const liste = s.ruines.map(id => parId[id]).filter(Boolean), mois = moisLong(s.cle);
    let corps;
    if (!liste.length) corps = `<p class="rien">${esc(premiere && cleMois(premiere) === s.cle ? t("rien_premiere", premiere) : t("rien"))}</p>`;
    else if (s.banc) corps = bancHTML(liste, mois);
    else corps = liste.map(epaveHTML).join("");
    return `<section class="strate${liste.length ? "" : " vide"}" aria-label="${esc(t("strate_aria", mois))}">` +
      `<header class="strate-tete"><div class="prof">${esc(t("strate_prof", s.profondeur, s.age))}</div><h3>${esc(mois)}</h3><div class="nb">${esc(t("strate_nb", liste.length))}</div></header>` +
      `<div class="fond">${corps}</div></section>`;
  }).join("");
  classerStrates();
}
/** Les strates situées dans la partie sombre du lagon (sous la zone claire, voir le dégradé de #lagon) prennent des plaques bleu nuit. */

// ---------- la grotte (fermée), au fond du lagon ----------
const LETTRES_GALERNE = (() => { const r = alea("galerne"), src = "GALERNEVENTDOUESTREMONTELESFONDS"; return Array.from({ length: 150 }, (_, j) => ({ ch: src[j % src.length], a0: r() * 6.283, rr: .15 + r() * .85, v: .3 + r() * .6, h0: r() })); })();
const ROCHE = (() => { const r = alea("roche"); return Array.from({ length: 400 }, () => r()); })();
function dessinerGrotte(t) {
  const cv = document.getElementById("cg"), sec = document.getElementById("grotte"), W = sec.offsetWidth, H = sec.offsetHeight, dpr = Math.min(devicePixelRatio || 1, 2);
  if (cv.width !== Math.round(W * dpr) || cv.height !== Math.round(H * dpr)) { cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); }
  const ctx = cv.getContext("2d"); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const tel = W < 700, cx = tel ? W / 2 : Math.max(W * .62, 560), mw = tel ? 250 : 400, mh = tel ? 210 : 330, bas = tel ? 330 : H - 110;
  let ri = 0; const r = () => ROCHE[ri++ % ROCHE.length];
  ctx.fillStyle = "#03060f"; ctx.fillRect(0, 0, W, H);
  for (let i = 0; i < 7; i++) { const y0 = 30 + i * (H / 7.5); ctx.fillStyle = i % 2 ? "#060b17" : "#081021"; ctx.beginPath(); ctx.moveTo(0, y0);
    for (let x = 0; x <= W + 40; x += 40) ctx.lineTo(x, y0 + Math.sin(x * .006 + i) * 14 + (r() - .5) * 10); ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.fill();
    ctx.strokeStyle = "rgba(140,160,200,.07)"; ctx.lineWidth = 1; ctx.stroke(); }
  // fondu avec le bas du lagon : les strates rocheuses émergent de la même eau sombre, sans palier
  const fondu = ctx.createLinearGradient(0, 0, 0, 120); fondu.addColorStop(0, "rgba(3,6,15,1)"); fondu.addColorStop(1, "rgba(3,6,15,0)"); ctx.fillStyle = fondu; ctx.fillRect(0, 0, W, 120);
  const bouche = () => { ctx.beginPath(); ctx.moveTo(cx - mw / 2, bas); ctx.bezierCurveTo(cx - mw * .56, bas - mh * .7, cx - mw * .28, bas - mh * 1.02, cx + mw * .02, bas - mh);
    ctx.bezierCurveTo(cx + mw * .34, bas - mh * .98, cx + mw * .56, bas - mh * .62, cx + mw / 2, bas); ctx.closePath(); };
  const halo = ctx.createRadialGradient(cx, bas - mh * .4, 0, cx, bas - mh * .4, mw * 1.2); halo.addColorStop(0, "rgba(100,190,215,.12)"); halo.addColorStop(1, "rgba(100,190,215,0)"); ctx.fillStyle = halo; ctx.fillRect(cx - mw * 1.3, bas - mh * 1.7, mw * 2.6, mh * 2.2);
  ctx.save(); bouche(); ctx.clip();
  ctx.fillStyle = "#02040a"; ctx.fillRect(cx - mw, bas - mh * 1.2, mw * 2, mh * 1.3);
  const lu = ctx.createRadialGradient(cx + mw * .05, bas - mh * .3, 0, cx, bas - mh * .3, mw * .62); lu.addColorStop(0, "rgba(120,205,225,.5)"); lu.addColorStop(.55, "rgba(70,140,175,.2)"); lu.addColorStop(1, "rgba(40,80,120,0)");
  ctx.fillStyle = lu; ctx.fillRect(cx - mw, bas - mh * 1.2, mw * 2, mh * 1.3);
  const braise = ctx.createRadialGradient(cx - mw * .12, bas - 6, 0, cx - mw * .12, bas - 6, mw * .3); braise.addColorStop(0, "rgba(246,196,69,.22)"); braise.addColorStop(1, "rgba(246,196,69,0)"); ctx.fillStyle = braise; ctx.fillRect(cx - mw, bas - mh, mw * 2, mh);
  const gx = cx + mw * .04, gy = bas - mh * .3, R = mw * .2; ctx.textAlign = "center";
  for (const l of LETTRES_GALERNE) { const an = l.a0 + l.v * t * .6, rr = l.rr * R, h = (l.h0 + l.v * .05 * t) % 1;
    const lx = gx + Math.cos(an) * rr * 1.35 + (h - .5) * R * .8, ly = gy + Math.sin(an) * rr * .7 - h * R * .9 + R * .3;
    police(ctx, 500, (tel ? 5 : 7) + (1 - l.rr) * (tel ? 3 : 5), F.mono); ctx.fillStyle = `rgba(2,5,12,${(.5 + .45 * Math.sin(Math.PI * h)).toFixed(2)})`; ctx.fillText(l.ch, lx, ly); }
  ctx.textAlign = "left"; ctx.restore();
  ctx.strokeStyle = "rgba(150,175,210,.3)"; ctx.lineWidth = 1.2; bouche(); ctx.stroke();
  ctx.fillStyle = "#081021"; for (let i = 0; i < 9; i++) { const sx = cx - mw * .36 + i * mw * .09, sy = bas - mh * (.93 - Math.abs(i - 4) * .025), sl = 10 + r() * (tel ? 14 : 24); ctx.beginPath(); ctx.moveTo(sx - 5, sy - 4); ctx.lineTo(sx + 5, sy - 4); ctx.lineTo(sx + (r() - .5) * 3, sy + sl); ctx.fill(); }
  ctx.save(); bouche(); ctx.clip(); ctx.strokeStyle = "rgba(170,186,212,.55)"; ctx.lineWidth = tel ? 2 : 3;
  for (let i = 1; i < 10; i++) { const bx = cx - mw / 2 + i * mw / 10; ctx.beginPath(); ctx.moveTo(bx, bas); ctx.lineTo(bx, bas - mh); ctx.stroke(); }
  [.38, .78].forEach(k => { ctx.beginPath(); ctx.moveTo(cx - mw / 2, bas - mh * k); ctx.lineTo(cx + mw / 2, bas - mh * k); ctx.stroke(); }); ctx.restore();
  const ky = bas - mh * .38; ctx.strokeStyle = "#c98a12"; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(cx, ky - 2, 6, Math.PI, 0); ctx.stroke(); ctx.fillStyle = "#c98a12"; arrondi(ctx, cx - 8, ky - 2, 16, 13, 2); ctx.fill();
  const txt = libelle("bientot"); police(ctx, 700, tel ? 11 : 13, F.mono); const pw = Math.max(tel ? 92 : 116, ctx.measureText(txt).width + 24), ph = tel ? 24 : 28, py = bas - mh * .78 + 10;
  ctx.strokeStyle = "rgba(170,186,212,.6)"; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(cx - pw * .3, py - 10); ctx.lineTo(cx - pw * .3, py); ctx.moveTo(cx + pw * .3, py - 10); ctx.lineTo(cx + pw * .3, py); ctx.stroke();
  ctx.fillStyle = "#e3e8f0"; arrondi(ctx, cx - pw / 2, py, pw, ph, 4); ctx.fill(); ctx.fillStyle = "#16223d"; ctx.textAlign = "center"; ctx.fillText(txt, cx, py + ph * .66); ctx.textAlign = "left";
  for (let i = 0; i < 9; i++) { const by = bas - mh - 20 - i * (tel ? 26 : 38) - (CALME ? 0 : (t * 14) % 38), bx = cx + mw * .1 + Math.sin(i * 1.7) * 14; if (by < 8) continue;
    ctx.strokeStyle = `rgba(170,215,235,${(.4 - i * .035).toFixed(2)})`; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(bx, by, 2 + (i % 3), 0, 6.283); ctx.stroke(); }
  ctx.fillStyle = "#04070f"; ctx.beginPath(); ctx.moveTo(0, bas + 2); for (let x = 0; x <= W; x += 30) ctx.lineTo(x, bas + 2 + Math.sin(x * .02) * 3); ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.fill();
}

// =====================================================================
// FICHE D'AGENT (dialog modal : focus piégé par le navigateur, Échap ferme, retour du focus)
// =====================================================================
const fiche = document.getElementById("fiche");
let retourFocus = null;
function entreesDe(nom) { const n = norm(nom); return DONNEES.journal.filter(j => norm(j.qui) === n).slice(0, 5); }
function ouvrirFiche(id, depuis) {
  retourFocus = depuis || document.activeElement;
  const cap = id === "capitaine", pol = id === "polaris", a = cap || pol ? null : AGENT[id];
  if (!cap && !pol && !a) return;
  const nom = cap ? t("capitaine") : pol ? DONNEES.polaris.nom : a.nom, col = cap ? C.encre : pol ? "#9fb8ff" : a.c;
  document.getElementById("fiche-pt").style.background = col;
  document.getElementById("fiche-nom").textContent = nom;
  document.getElementById("fiche-verbe").textContent = cap ? t("capitaine_role") : pol ? `${t("polaris_texte")}` : `${champ(a, "verbe")} · ${a.vent ? t("f_vent") : t("f_etoile")}`;
  const lignes = [];
  if (cap) lignes.push([t("f_role"), t("capitaine_role")], [t("f_pourquoi"), t("capitaine_pourquoi")], [t("f_piece"), `${t("etage").conseil} · ${t("capitaine_sous")}`]);
  else if (pol) lignes.push([t("f_role"), t("polaris_texte")], [t("f_pourquoi"), LANGUE === "fr" && DONNEES.polaris.role ? DONNEES.polaris.role : t("polaris_pourquoi")], [t("f_piece"), t("polaris_ou")]);
  else {
    lignes.push([t("f_role"), champ(a, "role")], [t("f_pourquoi"), champ(a, "pourquoi")], [t("f_etat"), t("etat")[a.etat]], [t("f_piece"), t("etage")[a.piece]]);
    const tache = champ(a, "tache"); if (tache) lignes.push([t("f_tache"), tache]);
  }
  const journal = entreesDe(cap ? "Capitaine" : nom);
  document.getElementById("fiche-corps").innerHTML =
    `<dl>${lignes.filter(l => l[1]).map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("")}</dl>` +
    (cap || pol ? "" : `<section><h3>${esc(t("f_feuille"))}</h3>${a.doc ? `<pre style="border-left-color:${col}">${esc(a.doc)}</pre>` : `<p class="vide-msg">${esc(t("f_sans_feuille"))}</p>`}</section>`) +
    `<section><h3>${esc(t("f_journal"))}</h3>${journal.length ? `<ul>${journal.map(j => `<li${langFr(j, "texte")}><span class="d">${esc(fmtD(j.date))}</span>${esc(champ(j, "texte"))}</li>`).join("")}</ul>` : `<p class="vide-msg">${esc(t("f_sans_journal"))}</p>`}</section>`;
  if (!fiche.open) fiche.showModal();
  document.getElementById("fiche-fermer").focus();
}
document.getElementById("fiche-fermer").addEventListener("click", () => fiche.close());
fiche.addEventListener("click", ev => { if (ev.target === fiche) fiche.close(); });
fiche.addEventListener("close", () => { if (retourFocus && document.contains(retourFocus)) retourFocus.focus(); });
document.addEventListener("click", ev => { const b = ev.target.closest?.("button[data-agent]"); if (b && !fiche.contains(b)) ouvrirFiche(b.dataset.agent, b); });
/** Toucher une nuée, le socle vide ou l'étoile Polaris ouvre la fiche (les mêmes fiches sont accessibles au clavier par le registre et l'équipage). */
function cibleSous(ev) {
  const r = S.cv.getBoundingClientRect(), x = ev.clientX - r.left, y = ev.clientY - r.top;
  let best = null, d0 = Infinity; for (const c of S.cibles) { const d = Math.hypot(c.x - x, c.y - y); if (d < c.r && d < d0) { d0 = d; best = c; } }
  return best;
}
S.cv.addEventListener("click", ev => { const c = cibleSous(ev); if (c) ouvrirFiche(c.id, null); });
S.cv.addEventListener("mousemove", ev => { S.cv.style.cursor = cibleSous(ev) ? "pointer" : ""; });

// =====================================================================
// SECTIONS (re-rendues à chaque changement de langue)
// =====================================================================
let journalOuvert = false;
const JOURNAL_COURT = 12;
function lien(href, texte, classe) { const u = httpsSeul(href); return u ? `<a class="bouton ${classe}" href="${esc(u)}" target="_blank" rel="noopener">${esc(texte)}<span class="sr"> ${esc(t("nouvel_onglet"))}</span></a>` : ""; }
function jauge(lbl, val, part, cls) { return `<div class="jauge ${cls}"><div class="l"><span>${esc(lbl)}</span><span>${esc(val)}</span></div><div class="barre-j" role="presentation"><i style="width:${Math.round(clamp(part) * 100)}%"></i></div></div>`; }
function rendreProductions() {
  const cartes = DONNEES.productions.map(p => {
    const chantier = p.vie === null && p.statut === "au chantier", alerte = p.vie !== null && p.vie / p.vie_totale < SEUIL_SURSIS;
    const badge = chantier ? "chantier" : alerte ? "alerte" : "vivante";
    let corps = "";
    if (chantier) corps = `<p class="meta">${esc(p.publier_avant ? t("avant", p.publier_avant) : t("statut")["au chantier"])}</p><p class="vide-msg">${esc(t("chantier_msg"))}</p>`;
    else {
      if (p.vie !== null) corps += jauge(t("vie"), t("jours", p.vie), p.vie / p.vie_totale, alerte ? "alerte" : "");
      corps += jauge(t("vues"), t("vues_val", p.vues, p.seuil), p.vues / p.seuil, "vues");
      corps += `<p class="meta">${esc([p.nee_le && t("nee", p.nee_le), p.releve_le && t("releve", p.releve_le)].filter(Boolean).join(" · "))}</p>`;
      const boutons = [lien(p.lien, t("jouer"), ""), lien(p.lien_web, t("web"), "second")].filter(Boolean);
      corps += boutons.length ? `<div class="actions">${boutons.join("")}</div>` : `<p class="vide-msg">${esc(t("aucun_lien"))}</p>`;
    }
    return `<article class="carte"><span class="badge ${badge}">${esc(t("type")[p.type] || p.type)} · ${esc(t("statut")[p.statut] || p.statut)}</span><h3>${esc(p.nom)}</h3>${corps}</article>`;
  });
  for (const f of DONNEES.file) cartes.push(`<article class="carte"><span class="badge chantier">${esc(t("type")[f.type] || f.type)} · ${esc(t("file"))}</span><h3>${esc(f.nom)}</h3><p class="vide-msg">${esc(t("file_msg"))}</p></article>`);
  document.getElementById("cartes").innerHTML = cartes.join("");
}
function rendreNaissances() {
  const b = DONNEES.bureau;
  document.getElementById("naiss-intro").textContent = t("naiss_intro", b.fournee);
  document.getElementById("idees").innerHTML = b.idees.length ? b.idees.map(i =>
    `<li class="idee"><div><h3>${esc(i.nom)}</h3><span class="meta">${esc(t("type")[i.type] || i.type)}</span><p${langFr(i, "pitch")}>${esc(champ(i, "pitch"))}</p></div><div class="note"><span class="sr">${esc(t("note"))} </span><b>${esc(fmtN(i.note))}</b> / 10</div></li>`).join("")
    : `<li class="vide-msg">${esc(t("naiss_vide"))}</li>`;
  const vote = lien(b.vote_url, t("voter"), "");
  document.getElementById("vote").innerHTML = vote ? `${vote}<p>${esc(t("vote_ouvert"))}</p>` : `<button type="button" class="bouton" disabled>${esc(t("vote_ferme"))}</button><p>${esc(t("vote_msg"))}</p>`;
}
function rendreJournal() {
  const liste = journalOuvert ? DONNEES.journal : DONNEES.journal.slice(0, JOURNAL_COURT);
  document.getElementById("liste-journal").innerHTML = liste.map(j => {
    const a = AGENTS.find(x => norm(x.nom) === norm(j.qui)), cap = norm(j.qui) === "capitaine", pol = norm(j.qui) === norm(DONNEES.polaris.nom);
    const qui = a || cap || pol ? `<button type="button" class="qui" data-agent="${a ? esc(a.id) : cap ? "capitaine" : "polaris"}">${esc(cap ? t("capitaine") : j.qui)}</button>` : `<span class="qui simple">${esc(j.qui)}</span>`;
    return `<li><div class="tete"><time datetime="${esc(j.date)}">${esc(fmtD(j.date))}</time>${qui}</div><p${langFr(j, "texte")}>${esc(champ(j, "texte"))}</p></li>`;
  }).join("");
  const plus = document.getElementById("plus-journal"), reste = DONNEES.journal.length - JOURNAL_COURT;
  plus.hidden = reste <= 0; plus.textContent = journalOuvert ? t("moins") : t("plus", reste); plus.setAttribute("aria-expanded", String(journalOuvert));
}
document.getElementById("plus-journal").addEventListener("click", () => { journalOuvert = !journalOuvert; rendreJournal(); classerStrates(); });
function rendreEquipe() {
  const etoiles = AGENTS.filter(a => !a.vent).length, vents = AGENTS.length - etoiles;
  document.getElementById("equipe-intro").textContent = t("equipe_intro", etoiles, vents);
  const groupes = ["ateliers", "cuisine", "salon"].map(p => [p, occupants(p)]).filter(([, l]) => l.length);
  const bouton = (id, nom, col, sous) => `<li><button type="button" data-agent="${esc(id)}"><span class="pt" style="background:${col}" aria-hidden="true"></span><b>${esc(nom)}</b><small>${esc(sous)}</small></button></li>`;
  document.getElementById("equipe").innerHTML = groupes.map(([p, l]) => `<div><h3>${esc(t("groupe")[p])}</h3><ul>${l.map(a =>
    bouton(a.id, a.nom, a.c, `${champ(a, "role")}${champ(a, "tache") && a.etat !== "veille" ? " · " + champ(a, "tache") : ""}`)).join("")}</ul></div>`).join("")
    + `<div><h3>${esc(t("groupe").conseil)}</h3><ul>${bouton("capitaine", t("capitaine"), C.encre, t("capitaine_role"))}</ul>`
    + `<h3 style="margin-top:16px">${esc(t("groupe").nuit)}</h3><ul>${bouton("polaris", DONNEES.polaris.nom, "#9fb8ff", t("polaris_texte"))}</ul></div>`;
}

function appliquerLangue(l, memoriser) {
  LANGUE = l; document.documentElement.lang = l;
  if (memoriser) try { localStorage.setItem(CLE_LANGUE, l); } catch (e) { /* stockage indisponible : choix valable pour cette visite */ }
  document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll("[data-i18n-aria]").forEach(el => el.setAttribute("aria-label", t(el.dataset.i18nAria)));
  document.querySelectorAll("[data-i18n-title]").forEach(el => el.setAttribute("title", t(el.dataset.i18nTitle)));
  document.querySelectorAll(".langue button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.langue === l)));
  document.getElementById("nb").innerHTML = t("nb", AGENTS.filter(a => a.etat === "actif").length, AGENTS.length);
  document.getElementById("grotte-p1").innerHTML = t("grotte_p1");
  document.getElementById("maj").textContent = t("maj", DONNEES.genere_le);
  document.title = t("titre");
  if (fiche.open) fiche.close();
  appliquerMoment(); majHorloge();
  rendreProductions(); rendreNaissances(); rendreJournal(); rendreEquipe(); construireLagon(); construireTextes();
  if (S.ctx) { preparerScene(); redessiner(); }
}
document.querySelectorAll(".langue button").forEach(b => b.addEventListener("click", () => appliquerLangue(b.dataset.langue, true)));

// =====================================================================
// ANIMATION : une seule boucle, en pause quand la scène et la grotte sont hors de l'écran ou l'onglet caché ; image fixe si le mouvement est réduit
// =====================================================================
let grotteVisible = false, derniereGrotte = 0;
function boucle(now) {
  if (CALME || document.hidden || (!S.visible && !grotteVisible)) { S.enCours = false; return; }
  if (S.visible) image(now);
  if (grotteVisible && now - derniereGrotte > 80) { dessinerGrotte(now / 1000); derniereGrotte = now; }
  requestAnimationFrame(boucle);
}
function relancer() { if (!S.enCours && !CALME && !document.hidden) { S.enCours = true; requestAnimationFrame(boucle); } }
/** Image fixe (mouvement réduit, partage, bascule jour/nuit, langue). */
function redessiner() { image(performance.now()); dessinerGrotte(3.2); if (!CALME) relancer(); }
function polices() {
  const f = ["600 16px 'Bricolage Grotesque'", "700 16px 'Bricolage Grotesque'", "800 16px 'Bricolage Grotesque'", "400 12px 'IBM Plex Mono'", "500 12px 'IBM Plex Mono'", "600 12px 'IBM Plex Mono'", "400 12px 'Instrument Sans'"];
  const charge = document.fonts ? Promise.all(f.map(x => document.fonts.load(x))).catch(() => null) : Promise.resolve();
  return Promise.race([charge, new Promise(ok => setTimeout(ok, 4000))]); // sans réseau, on dessine avec les polices de repli
}
async function demarrer() {
  if (MAREE) document.getElementById("maree").hidden = false;
  appliquerLangue(LANGUE, false);
  await polices();
  S.ctx = S.cv.getContext("2d");
  preparerScene(); decorLagon(); classerStrates();
  redessiner();
  setInterval(majHorloge, 1000);
  setInterval(() => { if (CALME && !PARTAGE) redessiner(); }, 15000); // mouvement réduit : l'astre et l'horloge avancent quand même
  new IntersectionObserver(es => { S.visible = es[0].isIntersecting; if (S.visible) relancer(); }).observe(document.getElementById("scene"));
  new IntersectionObserver(es => { grotteVisible = es[0].isIntersecting; if (grotteVisible) relancer(); }).observe(document.getElementById("grotte"));
  document.addEventListener("visibilitychange", () => { document.body.classList.toggle("pause", document.hidden); if (!document.hidden) relancer(); });
  REDUIT.addEventListener?.("change", () => { CALME = REDUIT.matches || PARTAGE; redessiner(); });
  let attente; addEventListener("resize", () => { clearTimeout(attente); attente = setTimeout(() => { preparerScene(); classerStrates(); decorLagon(); redessiner(); }, 150); });
  requestAnimationFrame(() => requestAnimationFrame(() => { document.body.dataset.pret = "1"; if (PARTAGE) document.title = "pret"; }));
}
demarrer();
</script>
